name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Sync (all extras for tests + gallery)
        run: uv sync --extra gallery --extra dev
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Tests
        run: uv run pytest -q
      - name: Build package
        run: uv build
