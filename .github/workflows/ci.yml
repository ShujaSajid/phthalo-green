name: ci

on:
  push:
    pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Sync (all extras for tests + gallery)
        run: uv sync --extra gallery --extra plotly --extra dev
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Tests
        run: uv run pytest -q
      - name: Examples
        run: |
          uv run python examples/01_minimal.py
          uv run python examples/02_gallery.py --preset thesis
          uv run python examples/03_themes.py
      - name: CLI
        run: |
          uv run phthalo-green --version
          uv run phthalo-green themes
          uv run phthalo-green preview figures/preview
      - name: Build package
        run: uv build
